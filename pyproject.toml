[tool.uv.workspace]
members = ["data-service", "webapp"]

[dependency-groups]
shared = [
    "pandas",
    "requests",
    "pytz",
]
dev = [
    "ruff",
    "pytest",
]
databricks = [
    "pyspark>=3.5.0",
    "delta-spark>=3.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["databricks"]
markers = [
    "spark: marks tests that require PySpark and Java (skip if Java not available)",
]

[tool.ruff.lint.per-file-ignores]
# Databricks injects spark, dbutils and display into notebook globals.
"databricks/notebooks/*.ipynb" = ["F821"]
# PySpark collect() returns naive datetimes (pinned to UTC in conftest).
"databricks/tests/*" = ["DTZ001"]

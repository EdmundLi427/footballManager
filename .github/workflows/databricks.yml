name: Databricks Tests

on:
  push:
    branches: [main]
    paths:
      - 'databricks/**'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    paths:
      - 'databricks/**'
      - 'pyproject.toml'
      - 'uv.lock'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Sync dependencies
        run: uv sync --frozen --all-groups

      - name: Lint with ruff
        run: uv run ruff check databricks/

      - name: Format check with ruff
        run: uv run ruff format --check databricks/

      - name: Run Layer 1 & 3 tests (no Spark required)
        run: uv run pytest databricks/tests/ -v -m "not spark"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Layer 2 Spark tests
        run: uv run pytest databricks/tests/ -v -m "spark"
        continue-on-error: true
        # Spark tests can be flaky in CI, so we allow failure but report results

  summary:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" = "failure" ]; then
            echo "Layer 1 & 3 tests failed"
            exit 1
          else
            echo "All critical tests passed"
          fi

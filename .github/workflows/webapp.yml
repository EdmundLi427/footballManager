name: webapp

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - "data-service/**"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches: [main]
    paths:
      - "webapp/**"
      - "data-service/**"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Format check
        run: uv run ruff format --check webapp/

      - name: Lint
        run: uv run ruff check webapp/

      - name: Run tests
        run: uv run --directory webapp pytest

[project]
name = "webapp"
version = "0.1.0"
description = "Flask chat UI for querying NFL data via Delta Lake"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "flask",
    "python-dotenv",
    "pytz",
]

[tool.uv]
workspace-member = true

[tool.uv.sources]
data-service = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

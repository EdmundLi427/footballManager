<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Manager Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            height: 80vh;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px 12px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn-clear {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid white;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .btn-clear:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #f7f7f7;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.5;
        }

        .message.user .message-bubble {
            background: #667eea;
            color: white;
            border-radius: 12px 4px 12px 12px;
        }

        .message.assistant .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 4px 12px 12px 12px;
        }

        .message-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 4px;
        }

        .loading {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px 12px 12px 12px;
        }

        .loading span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .loading span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            40% {
                opacity: 1;
                transform: translateY(-8px);
            }
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid #ddd;
            background: white;
            border-radius: 0 0 12px 12px;
            display: flex;
            gap: 10px;
        }

        .input-form {
            display: flex;
            gap: 10px;
            flex: 1;
        }

        .input-form input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .input-form input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-send {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.2s;
        }

        .btn-send:hover {
            transform: scale(1.05);
        }

        .btn-send:active {
            transform: scale(0.98);
        }

        .btn-send:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: scale(1);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #999;
            text-align: center;
        }

        .empty-state h2 {
            font-size: 20px;
            color: #666;
        }

        .empty-state p {
            font-size: 14px;
            max-width: 300px;
        }

        @media (max-width: 600px) {
            .container {
                height: 100vh;
                border-radius: 0;
            }

            .header h1 {
                font-size: 18px;
            }

            .message-bubble {
                max-width: 85%;
            }

            .header-actions {
                gap: 8px;
            }

            .btn-clear {
                padding: 6px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏈 Football Manager Chatbot</h1>
            <div class="header-actions">
                <button class="btn-clear" onclick="clearHistory()">Clear History</button>
            </div>
        </div>

        <div class="chat-messages" id="messages">
            <div class="empty-state">
                <h2>Welcome to Football Manager</h2>
                <p>Ask me about NFL injury news, player data, or query the database.</p>
            </div>
        </div>

        <div class="input-area">
            <form class="input-form" onsubmit="sendMessage(event)">
                <input
                    type="text"
                    id="messageInput"
                    placeholder="Ask about injuries, player stats, or query the database..."
                    autocomplete="off"
                />
                <button type="submit" class="btn-send" id="sendBtn">Send</button>
            </form>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(content, role) {
            const message = document.createElement('div');
            message.className = `message ${role}`;

            const label = document.createElement('div');
            label.className = 'message-label';
            label.textContent = role === 'user' ? 'You' : 'Assistant';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.innerHTML = content.replace(/\n/g, '<br>');

            message.appendChild(label);
            message.appendChild(bubble);

            if (messagesContainer.querySelector('.empty-state')) {
                messagesContainer.innerHTML = '';
            }

            messagesContainer.appendChild(message);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showLoading() {
            const message = document.createElement('div');
            message.className = 'message assistant';
            message.id = 'loading-message';

            const loading = document.createElement('div');
            loading.className = 'loading';
            loading.innerHTML = '<span></span><span></span><span></span>';

            message.appendChild(loading);
            messagesContainer.appendChild(message);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function removeLoading() {
            const loadingMsg = document.getElementById('loading-message');
            if (loadingMsg) loadingMsg.remove();
        }

        async function sendMessage(event) {
            event.preventDefault();

            const content = messageInput.value.trim();
            if (!content) return;

            addMessage(content, 'user');
            messageInput.value = '';
            sendBtn.disabled = true;
            showLoading();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: content })
                });

                removeLoading();

                if (!response.ok) {
                    const error = await response.json();
                    addMessage(`Error: ${error.error}`, 'assistant');
                } else {
                    const data = await response.json();
                    addMessage(data.response, 'assistant');
                }
            } catch (error) {
                removeLoading();
                addMessage(`Error: ${error.message}`, 'assistant');
            } finally {
                sendBtn.disabled = false;
                messageInput.focus();
            }
        }

        async function clearHistory() {
            if (confirm('Clear all chat history?')) {
                try {
                    await fetch('/api/clear', { method: 'POST' });
                    messagesContainer.innerHTML = `
                        <div class="empty-state">
                            <h2>Welcome to Football Manager</h2>
                            <p>Ask me about NFL injury news, player data, or query the database.</p>
                        </div>
                    `;
                    messageInput.focus();
                } catch (error) {
                    alert(`Error clearing history: ${error.message}`);
                }
            }
        }

        messageInput.focus();
    </script>
</body>
</html>
